name: Generate GitHub Stats Cards & Contribution Snake

on:
  schedule:
    - cron: '0 0,12 * * *' # Runs twice daily at 00:00 UTC (Midnight) and 12:00 UTC (Noon)
  workflow_dispatch:        # Manual trigger anytime from GitHub Actions tab

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript code
        run: npm run build

      - name: Generate static SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT_DIR: ./generated_svgs
        run: node dist/main.js

      - name: Generate Contribution Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ./generated_svgs/github-contribution-grid-snake.svg
            ./generated_svgs/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Deploy all SVGs to dedicated 'output' branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create temporary stage directory
          mkdir -p /tmp/generated_cards
          cp ./generated_svgs/*.svg /tmp/generated_cards/
          
          # Switch to orphan 'output' branch
          git checkout --orphan output 2>/dev/null || git checkout output
          
          # Remove all source files from working tree on output branch
          git rm -rf .
          
          # Copy generated SVGs to the root of the output branch
          cp /tmp/generated_cards/*.svg ./
          
          # Stage and commit
          git add *.svg
          if git diff --staged --quiet; then
            echo "No changes in generated cards."
          else
            git commit -m "build: update static SVG stats cards & contribution snake [skip ci]"
            git push origin output --force
          fi

      - name: Auto-sync Profile README to pvraj1011 profile repository (If Changed)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ] && [ -f "./profile_template/README.md" ]; then
            echo "[INFO] Checking master profile README sync for ${{ github.repository_owner }}/${{ github.repository_owner }}..."
            git clone https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/${{ github.repository_owner }}.git /tmp/profile_repo
            cp ./profile_template/README.md /tmp/profile_repo/README.md
            cd /tmp/profile_repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            if git diff --staged --quiet; then
              echo "[INFO] No changes detected in profile README. Skipping commit."
            else
              git commit -m "ci(profile): auto-sync updated profile README [skip ci]"
              git push origin main
              echo "[SUCCESS] Successfully updated profile README in ${{ github.repository_owner }}/${{ github.repository_owner }}!"
            fi
          else
            echo "[WARN] GH_PAT token or profile_template/README.md missing. Skipping auto-sync."
          fi

name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime from GitHub Actions tab

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript code
        run: npm run build

      - name: Generate static SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT_DIR: ./generated_svgs
        run: node dist/main.js

      - name: Deploy SVGs to dedicated 'output' branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create temporary stage directory
          mkdir -p /tmp/generated_cards
          cp ./generated_svgs/*.svg /tmp/generated_cards/
          
          # Switch to orphan 'output' branch
          git checkout --orphan output 2>/dev/null || git checkout output
          
          # Remove all source files from working tree on output branch
          git rm -rf .
          
          # Copy generated SVGs to the root of the output branch
          cp /tmp/generated_cards/*.svg ./
          
          # Stage and commit
          git add *.svg
          if git diff --staged --quiet; then
            echo "No changes in generated cards."
          else
            git commit -m "build: update static SVG stats cards [skip ci]"
            git push origin output --force
          fi

  <path d="M 0.5,8.5 A 8,8 0 0,1 8.5,0.5 L 486.5,0.5 A 8,8 0 0,1 494.5,8.5 L 494.5,34 L 0.5,34 Z" class="term-header" />
  
  <!-- Window Control Buttons -->
